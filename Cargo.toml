[workspace.package]
version = "0.6.0"
edition = "2024"
description = "Community crate for XR in Bevy"
repository = "https://github.com/awtterpip/bevy_oxr"
license = "MIT/Apache-2.0"

[workspace]
resolver = "2"
members = ["crates/*", "crates/bevy_openxr/examples/android"]

[workspace.dependencies]
bevy = "0.20"
bevy_android = { version = "0.20", default-features = false }
bevy_ecs = { version = "0.20", default-features = false }
bevy_extract = { version = "0.20", default-features = true }
bevy_math = { version = "0.20", default-features = false }
bevy_render = { version = "0.20", default-features = false }
bevy_core_pipeline = { version = "0.20", default-features = false }
bevy_window = { version = "0.20", default-features = false }
bevy_winit = { version = "0.20", default-features = false }
bevy_pbr = { version = "0.20", default-features = false }
bevy_app = { version = "0.20", default-features = false }
bevy_reflect = { version = "0.20", default-features = false }
bevy_log = { version = "0.20", default-features = false }
bevy_gizmos = { version = "0.20", default-features = false }
bevy_camera = { version = "0.20", default-features = false }
bevy_color = { version = "0.20", default-features = false }
bevy_transform = { version = "0.20", default-features = false }
bevy_derive = { version = "0.20", default-features = false }
bevy_platform = { version = "0.20", default-features = false }


bevy_mod_xr = { path = "crates/bevy_xr", version = "0.6.0" }
bevy_mod_openxr = { path = "crates/bevy_openxr", version = "0.6.0" }
bevy_xr_utils = { path = "crates/bevy_xr_utils", version = "0.6.0" }
openxr = "0.22.0"
thiserror = "2.0.3"
wgpu = "30"
wgpu-hal = "30"

# wgpu 30.0.1 plus `vulkan::Queue::external_lock`, which `OxrQueueLock` takes
# around the OpenXR calls that use the Vulkan queue. Every wgpu crate wgpu-hal
# depends on is patched so one copy of each resolves. Drop once wgpu offers its
# own way to share the queue.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/stevesloan/wgpu.git", rev = "920457d862de7d1dd79cf331420e7295e014a09f" }
wgpu-types = { git = "https://github.com/stevesloan/wgpu.git", rev = "920457d862de7d1dd79cf331420e7295e014a09f" }
wgpu-naga-bridge = { git = "https://github.com/stevesloan/wgpu.git", rev = "920457d862de7d1dd79cf331420e7295e014a09f" }
naga = { git = "https://github.com/stevesloan/wgpu.git", rev = "920457d862de7d1dd79cf331420e7295e014a09f" }
naga-types = { git = "https://github.com/stevesloan/wgpu.git", rev = "920457d862de7d1dd79cf331420e7295e014a09f" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
